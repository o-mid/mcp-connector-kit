<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">MCP Connector Kit gateway</title>
  <desc id="desc">One MCP gateway linked to Wikipedia, weather, exchange rates, papers, books, and earthquakes.</desc>
  <defs>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" rx="24" fill="#09090b"/>
  <rect width="800" height="480" rx="24" fill="url(#cardGrad)" stroke="#27272a" stroke-width="1"/>
  <g stroke="#27272a" stroke-width="1">
    <path d="M0 80h800M0 160h800M0 240h800M0 320h800M0 400h800"/>
    <path d="M80 0v480M160 0v480M240 0v480M320 0v480M400 0v480M480 0v480M560 0v480M640 0v480M720 0v480"/>
  </g>
  <g transform="translate(400,228)">
    <polygon points="0,-42 28,-24 28,24 0,42 -28,24 -28,-24" fill="url(#hubGrad)"/>
    <text y="5" text-anchor="middle" fill="#09090b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">gateway</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#a1a1aa">
    <g><line x1="400" y1="228" x2="400" y2="88" stroke="#3f3f46"/><rect x="356" y="68" width="88" height="28" rx="8" fill="#18181b" stroke="#3f3f46"/><text x="400" y="86" text-anchor="middle">Wikipedia</text></g>
    <g><line x1="400" y1="228" x2="560" y2="142" stroke="#3f3f46"/><rect x="516" y="122" width="88" height="28" rx="8" fill="#18181b" stroke="#3f3f46"/><text x="560" y="140" text-anchor="middle">Weather</text></g>
    <g><line x1="400" y1="228" x2="560" y2="314" stroke="#3f3f46"/><rect x="516" y="294" width="88" height="28" rx="8" fill="#18181b" stroke="#3f3f46"/><text x="560" y="312" text-anchor="middle">Rates</text></g>
    <g><line x1="400" y1="228" x2="400" y2="368" stroke="#3f3f46"/><rect x="356" y="348" width="88" height="28" rx="8" fill="#18181b" stroke="#3f3f46"/><text x="400" y="366" text-anchor="middle">Papers</text></g>
    <g><line x1="400" y1="228" x2="240" y2="314" stroke="#3f3f46"/><rect x="196" y="294" width="88" height="28" rx="8" fill="#18181b" stroke="#3f3f46"/><text x="240" y="312" text-anchor="middle">Books</text></g>
    <g><line x1="400" y1="228" x2="240" y2="142" stroke="#3f3f46"/><rect x="196" y="122" width="88" height="28" rx="8" fill="#18181b" stroke="#3f3f46"/><text x="240" y="140" text-anchor="middle">Quakes</text></g>
  </g>
  <rect x="32" y="408" width="736" height="40" rx="12" fill="#09090b" stroke="#27272a"/>
  <circle cx="52" cy="428" r="4" fill="#34d399"/>
  <text x="68" y="433" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">POST /demo/mcp | keyless tools</text>
</svg>
