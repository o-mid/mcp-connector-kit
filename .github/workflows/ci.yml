name: ci

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          MCK_LIVE: "0"
      - run: node scripts/validate-registry.mjs
      - name: Verified connector contracts (mck check)
        run: node packages/cli/dist/cli.js check .
